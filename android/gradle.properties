# Daemon heap. 3G is comfortably above what this build peaks at (R8 full mode on
# a two-source-file module); the previous -Xmx8G -XX:MaxMetaspaceSize=4G let a
# single daemon claim 12G on a 16G machine, which is what made the IDE crawl.
# G1PeriodicGCInterval makes an idle daemon hand pages back to the OS instead of
# sitting on its high-water mark until it times out.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:+HeapDumpOnOutOfMemoryError

# The android module is one MainActivity.kt plus a generated registrant, so a
# separate Kotlin daemon JVM costs more than it saves. Compile in-process.
kotlin.compiler.execution.strategy=in-process

# 4 physical cores; leaving one free keeps the IDE responsive during a build.
org.gradle.workers.max=3
org.gradle.caching=true
# Exit an idle daemon after 30min rather than holding RAM for the 3h default.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
android.enableJetifier=false
# R8 full mode. This is already the AGP 8 default; stating it explicitly keeps
# the optimisation from silently switching off if the default ever changes or a
# dependency's gradle.properties gets merged in.
android.enableR8.fullMode=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
